bundle:
  name: banking_lakehouse_bundle

# 1. BUNDLE VARIABLES
variables:
  storage_account_name:
    description: "Name of the Azure Storage Account"
    default: "datalakevamshi"
  existing_cluster_id:
    description: "ID of the existing Databricks cluster"
    default: "0724-123038-m14eeun6"

# 2. WORKFLOW RESOURCES
resources:
  jobs:
    banking_etl_pipeline:
      name: Banking_Lakehouse_ETL_Pipeline

      tasks:
        # Step 1: Upload seed data from repo to ADLS landing directory
        - task_key: load_seed_data
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/00_seed_data_loader.py
            base_parameters:
              storage_account: ${var.storage_account_name}

        # Step 2: Setup Catalog & Schemas
        - task_key: setup_environment
          depends_on:
            - task_key: load_seed_data
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./ddl/00_setup_environment.sql
            base_parameters:
              storage_account: ${var.storage_account_name}

        # Step 3: Bronze Auto Loader Ingestion
        - task_key: bronze_ingestion
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              storage_account: ${var.storage_account_name}

        # Step 4: Silver Transformation
        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/02_silver_transformations.py

        # Step 5: Gold Aggregations
        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformation
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/03_gold_reporting.py

# 3. TARGET WORKSPACE CONFIGURATION
targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}