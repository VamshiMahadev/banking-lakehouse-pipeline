bundle:
  name: banking_lakehouse_bundle

# 1. BUNDLE VARIABLES
variables:
  storage_account_name:
    description: "Name of the Azure Storage Account"
    default: "datalakevamshi"
  existing_cluster_id:
    description: "ID of the existing Databricks cluster"
    default: "0724-123038-m14eeun6" # Replace with your actual Cluster ID from Databricks UI

resources:
  jobs:
    banking_etl_pipeline:
      name: Banking_Lakehouse_ETL_Pipeline

      tasks:
        - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./ddl/00_setup_environment.sql
            base_parameters:
              storage_account: ${var.storage_account_name}

        - task_key: bronze_ingestion
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              storage_account: ${var.storage_account_name}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/02_silver_transformations.py

        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformation
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/03_gold_reporting.py

# 2. TARGET WORKSPACE CONFIGURATION
targets:
  dev:
    mode: development
    default: true
      
  prod:
    mode: production
    workspace:
      root_path: /Workspace/project/.bundle/${bundle.name}/${bundle.target}