bundle:
  name: banking_lakehouse_bundle

# 1. BUNDLE VARIABLES (Only for non-secret workspace parameters)
variables:
  storage_account_name:
    description: "Name of the Azure Storage Account"
    default: "datalakevamshi"
  cluster_name:
    description: "Name of the target Databricks cluster"
    default: "my-banking-cluster"

resources:
  jobs:
    banking_etl_pipeline:
      name: Banking_Lakehouse_ETL_Pipeline

      # Define a job cluster using the cluster_name variable
      job_clusters:
        - job_cluster_key: banking_job_cluster
          new_cluster:
            cluster_name: ${var.cluster_name}
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
      
      tasks:
        - task_key: setup_environment
          job_cluster_key: banking_job_cluster
          notebook_task:
            notebook_path: ./ddl/00_setup_environment.sql
            base_parameters:
              storage_account: ${var.storage_account_name}

        - task_key: bronze_ingestion
          depends_on:
            - task_key: setup_environment
          job_cluster_key: banking_job_cluster
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              storage_account: ${var.storage_account_name}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: banking_job_cluster
          notebook_task:
            notebook_path: ./notebooks/02_silver_transformations.py

        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: banking_job_cluster
          notebook_task:
            notebook_path: ./notebooks/03_gold_reporting.py

# 2. TARGET WORKSPACE CONFIGURATION
# Databricks CLI automatically picks up host from the environment variable DATABRICKS_HOST
targets:
  dev:
    mode: development
    default: true
      
  prod:
    mode: production
    workspace:
      root_path: /Workspace/project/.bundle/${bundle.name}/${bundle.target}