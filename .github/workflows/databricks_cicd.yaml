name: Banking Pipeline CI/CD

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]

jobs:
  # STAGE 1: Linting and Validation
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.1

      - name: Validate Databricks Asset Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev

  # STAGE 2: Deployment
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.1

      - name: Deploy DAB Bundle to Workspace
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t prod

  # STAGE 3: Execute Job & Validate Results
  run-and-verify:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.1

      - name: Trigger Databricks Workflow Execution
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          RUN_ID=$(databricks bundle run banking_etl_pipeline -t prod --json | jq -r '.run_id')
          echo "Triggered Run ID: $RUN_ID"
          
          # Wait for execution completion
          while true; do
            STATUS=$(databricks runs get --run-id $RUN_ID --json | jq -r '.state.life_cycle_state')
            echo "Current status: $STATUS"
            if [ "$STATUS" == "TERMINATED" ] || [ "$STATUS" == "SKIPPED" ] || [ "$STATUS" == "INTERNAL_ERROR" ]; then
              break
            fi
            sleep 15
          done
          
          RESULT=$(databricks runs get --run-id $RUN_ID --json | jq -r '.state.result_state')
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "Pipeline run failed with result state: $RESULT"
            exit 1
          fi
          echo "Pipeline run completed successfully!"