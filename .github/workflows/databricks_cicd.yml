name: Databricks Asset Bundles CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  pipeline:
    name: Deploy and Run Databricks Pipeline
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.3

      - name: Validate Databricks Asset Bundle
        run: |
          databricks bundle validate -t prod

      - name: Deploy Databricks Asset Bundle
        run: |
          databricks bundle deploy -t prod

      - name: Run Databricks Bundle Pipeline
        run: |
          echo "🚀 Triggering Banking Lakehouse ETL Pipeline..."
          
          # 1. Execute job and capture all output (stderr + stdout)
          RAW_OUTPUT=$(databricks bundle run banking_etl_pipeline -t prod -o json 2>&1)
          
          # 2. Strip leading warning logs before the first '{' for clean JSON parsing
          CLEAN_JSON=$(echo "$RAW_OUTPUT" | sed -n '/^{/,$p')

          # 3. Extract run_id safely using jq
          RUN_ID=$(echo "$CLEAN_JSON" | jq -r '.run_id // .job_run_id // .id // empty')

          if [ -n "$RUN_ID" ]; then
            echo "✅ Triggered Run ID: $RUN_ID"
          else
            echo "⚠️ Could not parse Run ID directly from JSON output."
          fi

          # 4. Verify job execution status
          if echo "$RAW_OUTPUT" | grep -q "TERMINATED SUCCESS"; then
            echo "🎉 Pipeline executed and terminated with SUCCESS!"
            exit 0
          else
            echo "❌ Pipeline run failed or did not terminate successfully."
            echo "--- Raw Output ---"
            echo "$RAW_OUTPUT"
            exit 1
          fi